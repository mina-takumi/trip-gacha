<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レアリティの色味 見本</title>
<!-- 開発サーバー(npm run dev)で http://localhost:5173/mockups/rarity-tint.html を開く。絵は public/art から読む -->
<style>
  body { margin: 0; padding: 16px; background: #F4EDE0; color: #22303C; font: 700 13px/1.5 "Zen Maru Gothic", sans-serif; }
  h2 { font-size: 15px; margin: 22px 0 4px; }
  p { margin: 0 0 8px; font-weight: 400; }
  .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .lbl { text-align: center; margin-top: 4px; }
  .card { border-radius: 9px; padding: 5px; background: var(--frame); }
  .card .in { background: #131A31; border-radius: 5px; padding: 4px; }
  .card .num { font: 600 9px/1 serif; color: #E7CF8E; text-align: center; padding: 1px 0 4px; }
  .card .art { position: relative; aspect-ratio: 1; overflow: hidden; border-radius: 3px; }
  .card .art img { width: 100%; height: 100%; display: block; }
  /* 枠(太く・色の差を広げた案) */
  .N { --frame: linear-gradient(135deg, #4E220E, #A9592F 42%, #5C2A12 70%, #8E4824); }
  .R { --frame: linear-gradient(135deg, #7F8891, #F1F4F6 42%, #8C959E 70%, #D6DCE1); }
  .S { --frame: linear-gradient(135deg, #B8860B, #FFF3A8 42%, #E0B000 70%, #FFE066); }
  /* 案A: 色相をずらす(銅)・色を抜く(銀)・そのまま(金) */
  .a .N img { filter: hue-rotate(-20deg) saturate(1.25) brightness(.88); }
  .a .R img { filter: saturate(0) brightness(1.12); }
  /* 案B: 銅は茶色を足す・銀は少し青みを残す・金は少し明るく */
  .b .N img { filter: sepia(.35) hue-rotate(-28deg) saturate(1.5) brightness(.82); }
  .b .R img { filter: saturate(.12) brightness(1.15) contrast(1.05); }
  .b .S img { filter: saturate(1.25) brightness(1.08); }
  /* 案C: 銀は青灰色を重ねる(明るい所は銀、暗い所は濃紺のまま) */
  .c .N img { filter: hue-rotate(-20deg) saturate(1.25) brightness(.88); }
  .c .R .art::after { content: ""; position: absolute; inset: 0; background: #9DB0C8; mix-blend-mode: color; }
  .c .R img { filter: brightness(1.12); }
</style>
</head>
<body>
<p>同じ金の絵を、アプリ側で色味だけ変えた見本。左からノーマル(銅)・レア(銀)・スーパーレア(金)。枠は太くして色の差を広げた案。</p>
<div id="out"></div>
<script>
  const sets = [
    ['a', '案A 銅は赤みを足す・銀は色を全部抜く・金はそのまま'],
    ['b', '案B 銅は茶色を足す・銀は青みを少し残す・金は少し明るく'],
    ['c', '案C 銅は案Aと同じ・銀は青灰色を重ねる・金はそのまま'],
  ];
  const arts = [['lighthouse', 'X'], ['ring', 'X'], ['gate', '0']];
  const card = (cls, art, num) =>
    `<div><div class="card ${cls}"><div class="in"><div class="num">${num}</div><div class="art"><img src="/art/special/${art}.webp"></div></div></div>` +
    `<div class="lbl">${{ N: 'ノーマル', R: 'レア', S: 'スーパーレア' }[cls]}</div></div>`;
  document.getElementById('out').innerHTML = sets.map(([k, title]) =>
    `<section class="${k}"><h2>${title}</h2>` +
    arts.map(([art, num]) => `<div class="row" style="margin-bottom:10px">${['N', 'R', 'S'].map((c) => card(c, art, num)).join('')}</div>`).join('') +
    `</section>`).join('');
</script>
</body>
</html>
