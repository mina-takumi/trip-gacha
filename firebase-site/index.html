<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トリップガチャ</title>
<style>
  :root { --cream: #FBF6EC; --navy: #22303C; --orange: #E8552F; --soft: #5A6672; }
  body { margin: 0; background: var(--cream); color: var(--navy); font: 16px/1.8 "Hiragino Maru Gothic ProN", "Zen Maru Gothic", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 32px; margin: 0 0 8px; }
  .lead { color: var(--soft); margin: 0 0 32px; }
  h2 { font-size: 20px; margin: 32px 0 8px; border-bottom: 3px solid var(--navy); }
  a.btn { display: inline-block; margin-top: 8px; padding: 10px 20px; border: 2px solid var(--navy); border-radius: 24px; background: var(--orange); color: #fff; font-weight: 700; text-decoration: none; box-shadow: 3px 3px 0 var(--navy); }
  footer { margin-top: 48px; font-size: 14px; color: var(--soft); }
  footer a { color: var(--navy); }
</style>
</head>
<body>
<main>
  <h1>トリップガチャ</h1>
  <p class="lead">駅やバス停の近くでガチャを回して、カードを集める位置情報ゲームです。</p>

  <h2>遊び方</h2>
  <p>駅・バス停の200m以内に入ると、その場所のガチャを回せます。その日たくさん移動するほど、良いカードが出やすくなります。集めたカードは図鑑で見られます。</p>

  <h2>Googleでのログイン(任意)</h2>
  <p>Googleでログインすると、記録をサーバーに保存し、別の端末でも続きから遊べます。ログインしなくても、すべての機能で遊べます。預かる情報と消し方は<a href="privacy.html">プライバシーポリシー</a>に書いています。</p>

  <a class="btn" href="https://trip-gacha.pages.dev/">トリップガチャを開く</a>

  <footer>
    <p><a href="privacy.html">プライバシーポリシー</a> ・ 問い合わせ: <span>tripgacha.support@gmail.com</span></p>
  </footer>
</main>
</body>
</html>
